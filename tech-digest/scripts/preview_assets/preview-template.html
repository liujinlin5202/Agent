    body { margin:0; padding:20px; background:#f6f8fa; color:#1f2328; }
    .preview-controls { max-width:920px; margin:0 auto 20px; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
    .preview-controls h1 { margin:0 0 8px; font-size:20px; overflow-wrap:anywhere; }
    .preview-controls p { margin:6px 0 12px; color:#59636e; }
    .preview-controls .actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
    .preview-controls button,.preview-controls select { font:inherit; min-height:36px; padding:5px 10px; border:1px solid #c9d1d9; border-radius:5px; background:#fff; color:#1f2328; max-width:100%; }
    .preview-controls a { color:#0969da; }
    .preview-stage { width:100%; max-width:920px; margin:auto; padding:24px; border:1px solid #d1d9e0; background:#fff; }
    .preview-stage[data-width="mobile"] { max-width:360px; padding:18px; }
    .preview-stage[data-width="narrow"] { max-width:320px; padding:14px; }
    .markdown-body { min-width:0; overflow-wrap:anywhere; font-family:system-ui,"Microsoft YaHei",sans-serif; }
    .markdown-body .md-code-block { min-width:0; max-width:100%; }
    .markdown-body pre { max-width:100%; overflow-x:auto; }
    .markdown-body pre code { white-space:pre; overflow-wrap:normal; }
    .markdown-body table { display:block; max-width:100%; overflow-x:auto; }
    .markdown-body img { max-width:100%; height:auto; }
    #preview-status { min-height:22px; margin-top:8px; }
    @media(max-width:520px) { body { padding:0; } .preview-controls { padding:12px; } .preview-stage { padding:16px; } }
  </style>
</head>

    <div class="actions">
      <label>查看宽度 <select id="preview-width"><option value="desktop">桌面</option><option value="mobile">手机 · 360px</option><option value="narrow">窄屏 · 320px</option></select></label>
      <a href="body.md">Markdown 正文</a>
      <a href="check.json">本地检查结果</a>
    </div>
    <div id="preview-status" role="status" aria-live="polite"></div>
  </header>
  <main class="preview-stage" id="preview-stage" data-width="desktop">
    <article class="markdown-body w-full" id="post-body" aria-label="研究解读正文" data-theme="light"></article>

      try { await navigator.clipboard.writeText(code); status.textContent = '代码已复制。'; }
